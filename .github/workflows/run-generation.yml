name: "Run generation pipeline (tap to run)"

# Manual button: starts one execution of the maths-template-generation Step
# Functions state machine and waits for the result. The happy path writes a
# verified template through the API (which makes next-drill serve questions);
# force_disagreement exercises the human-review branch instead.
#
# Requires the same AWS_DEPLOY_ROLE_ARN variable as the deploy workflow.

on:
  workflow_dispatch:
    inputs:
      skill_slug:
        description: "Skill slug to generate for"
        type: string
        default: times-tables-to-12
      force_disagreement:
        description: "Force the human-review branch"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — role variable present
        run: |
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::Actions variable AWS_DEPLOY_ROLE_ARN is not set"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Start execution and wait
        run: |
          ARN=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='maths-template-generation'].stateMachineArn" \
            --output text)
          [ -n "$ARN" ] || { echo "::error::State machine not found — deploy MathsGenerationPipeline first"; exit 1; }

          INPUT=$(printf '{"skill_slug": "%s", "force_disagreement": %s}' \
            "${{ inputs.skill_slug }}" "${{ inputs.force_disagreement }}")
          echo "input: $INPUT"
          EXEC_ARN=$(aws stepfunctions start-execution --state-machine-arn "$ARN" \
            --input "$INPUT" --query executionArn --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" \
              --query status --output text)
            [ "$STATUS" = "RUNNING" ] || break
            sleep 5
          done

          OUTPUT=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" \
            --query output --output text 2>/dev/null || echo "null")
          {
            echo "## Generation pipeline run"
            echo "- status: **$STATUS**"
            echo "- input: \`$INPUT\`"
            echo '```json'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status: $STATUS"
          [ "$STATUS" = "SUCCEEDED" ] || { echo "::error::Execution ended $STATUS — check Step Functions console / Lambda logs"; exit 1; }
