name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API — ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e 'apps/api[dev]'
      - name: Ruff lint
        run: ruff check apps/api scripts
      - name: Ruff format check
        run: ruff format --check apps/api scripts
      - name: Mypy
        run: mypy apps/api/app scripts
      - name: Pytest
        run: pytest apps/api/tests -q
      - name: Validate example content (no DB)
        run: |
          python scripts/load_graph.py content/graph.yaml --check
          python scripts/load_paper.py content/papers/example-arithmetic-a --check

  web:
    name: Web — eslint, tsc, vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run

  infra:
    name: Infra — tsc, cdk synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: CDK synth (no credentials needed)
        run: npx cdk synth -q
        env:
          INTERNAL_HMAC_SECRET: ci-synth-placeholder
