name: "Deploy AWS (tap to run)"

# Manual button only — never fires on push (Phase 1 rule). Credentials come
# from GitHub's OIDC federation into the maths-github-deploy IAM role created
# by scripts/aws_bootstrap_cloudshell.sh; no long-lived AWS keys exist
# anywhere. Run it from the GitHub mobile app: Actions → Deploy AWS → Run.
#
# Requires (Settings → Secrets and variables → Actions):
#   variable  AWS_DEPLOY_ROLE_ARN   arn:aws:iam::<acct>:role/maths-github-deploy
#   variable  API_BASE_URL          https://<render-url>   (Lambdas post here)
#   variable  WEB_ORIGINS           https://<vercel-url>,http://localhost:3000
#   variable  BUDGET_ALERT_EMAIL    you@example.com
#   secret    INTERNAL_HMAC_SECRET  same value the API holds on Render

on:
  workflow_dispatch:
    inputs:
      stacks:
        description: "Which stacks to deploy"
        type: choice
        default: all
        options:
          - all
          - MathsUploadPipeline
          - MathsGenerationPipeline
          - MathsBudget

concurrency:
  group: aws-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Guard — required configuration present
        working-directory: .
        run: |
          missing=0
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::Actions variable AWS_DEPLOY_ROLE_ARN is not set (run scripts/aws_bootstrap_cloudshell.sh first — it prints the ARN)"; missing=1; }
          [ -n "${{ secrets.INTERNAL_HMAC_SECRET }}" ] || { echo "::error::Actions secret INTERNAL_HMAC_SECRET is not set"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - run: npm ci

      - name: CDK deploy
        env:
          INTERNAL_HMAC_SECRET: ${{ secrets.INTERNAL_HMAC_SECRET }}
        run: |
          ARGS=()
          [ -n "${{ vars.API_BASE_URL }}" ] && ARGS+=(-c "apiBaseUrl=${{ vars.API_BASE_URL }}")
          [ -n "${{ vars.WEB_ORIGINS }}" ] && ARGS+=(-c "webOrigins=${{ vars.WEB_ORIGINS }}")
          [ -n "${{ vars.BUDGET_ALERT_EMAIL }}" ] && ARGS+=(-c "budgetEmail=${{ vars.BUDGET_ALERT_EMAIL }}")
          if [ "${{ inputs.stacks }}" = "all" ]; then
            STACKS=(MathsUploadPipeline MathsGenerationPipeline MathsBudget)
          else
            STACKS=("${{ inputs.stacks }}")
          fi
          npx cdk deploy "${STACKS[@]}" --require-approval never \
            --outputs-file outputs.json "${ARGS[@]}"

      - name: Publish stack outputs to the run summary
        run: |
          echo "## Stack outputs" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy **UploadBucketName** into the Render env var \`S3_UPLOAD_BUCKET\`, then redeploy the API." >> "$GITHUB_STEP_SUMMARY"
